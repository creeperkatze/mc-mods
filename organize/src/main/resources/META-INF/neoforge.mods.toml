modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/creeperkatze/mc-mods/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/creeperkatze/mc-mods/tree/main/${mod_folder}"
iconFile = "assets/organize/icon.png"
authors = "Creeperkatze"
description = "${mod_description}"

[[mixins]]
config = "organize.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
