name: Release

on:
  push:
    tags:
      - '*/v*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. my-mod/v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read release info
        id: info
        run: |
          mod="${TAG%%/*}"
          version="${TAG#*/v}"
          test -f "$mod/gradle.properties" || { echo "::error::No mod named $mod"; exit 1; }
          test "$(sed -n 's/^mod_version=//p' "$mod/gradle.properties")" = "$version" || { echo "::error::$TAG doesn't match mod_version in $mod/gradle.properties"; exit 1; }
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' "$mod/CHANGELOG.md" > notes.md
          test -n "$(tr -d '[:space:]' < notes.md)" || { echo "::error::No changelog for $version in $mod/CHANGELOG.md"; exit 1; }
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^mod_name=//p' "$mod/gradle.properties") $version" >> "$GITHUB_OUTPUT"

      - name: Download jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: jars/

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.info.outputs.name }}
          files: jars/**/${{ steps.info.outputs.mod }}-*.jar
          body_path: notes.md
          draft: true
          tag_name: ${{ env.TAG }}
