name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. my-mod/v1.0.0'
        required: true
      modrinth:
        description: 'Publish to Modrinth'
        type: boolean
        default: true
      curseforge:
        description: 'Publish to CurseForge'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
          MODRINTH: ${{ inputs.modrinth }}
          CURSEFORGE: ${{ inputs.curseforge }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          mod="${TAG%%/*}"
          tasks=()
          if [ "$MODRINTH" = true ]; then tasks+=(":$mod:publishModrinth"); fi
          if [ "$CURSEFORGE" = true ]; then tasks+=(":$mod:publishCurseforge"); fi
          test ${#tasks[@]} -gt 0 || { echo "::error::Pick at least one platform"; exit 1; }
          ./gradlew "${tasks[@]}"
