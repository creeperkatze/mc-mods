<head>
	<title>Illuminate</title>
	<meta
		description="Ambient lighting from Minecraft with the Illuminate mod. The left of the canvas is your left, the top is the sky."
	/>
	<meta publisher="Creeperkatze" />
	<meta property="smoothing" label="Smoothing" type="number" min="0" max="10" default="2" />
</head>

<body style="margin: 0; padding: 0; background: #000">
	<canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
	var canvas = document.getElementById('exCanvas');
	var context = canvas.getContext('2d');
	var grid = document.createElement('canvas');
	var gridContext = grid.getContext('2d');
	var target = null;
	var current = null;
	var lastFrame = 0;
	var timeout = 3000;

	function onCanvasApiEvent(apiEvent) {
		if (apiEvent.sender !== 'illuminate') {
			return;
		}
		var data = String(apiEvent.event);
		if (data === 'release') {
			lastFrame = 0;
			return;
		}
		var separator = data.indexOf(':');
		var size = data.substring(0, separator).split('x');
		var width = parseInt(size[0], 10);
		var height = parseInt(size[1], 10);
		var hex = data.substring(separator + 1);
		if (!(width > 0 && height > 0) || hex.length !== width * height * 6) {
			return;
		}
		if (width !== grid.width || height !== grid.height) {
			grid.width = width;
			grid.height = height;
			current = null;
		}
		target = new Float32Array(width * height * 3);
		for (var i = 0; i < target.length; i++) {
			target[i] = parseInt(hex.substr(i * 2, 2), 16);
		}
		if (current === null) {
			current = Float32Array.from(target);
		}
		lastFrame = Date.now();
	}

	function update() {
		if (target !== null && Date.now() - lastFrame < timeout) {
			// Minecraft sends about 30 frames per second, easing towards each one fills in the frames in between
			var easing = 1 / (1 + Math.max(0, Number(smoothing) || 0));
			var image = gridContext.createImageData(grid.width, grid.height);
			for (var cell = 0; cell < grid.width * grid.height; cell++) {
				for (var channel = 0; channel < 3; channel++) {
					var i = cell * 3 + channel;
					current[i] += (target[i] - current[i]) * easing;
					image.data[cell * 4 + channel] = current[i];
				}
				image.data[cell * 4 + 3] = 255;
			}
			gridContext.putImageData(image, 0, 0);
			context.imageSmoothingEnabled = true;
			context.drawImage(grid, 0, 0, canvas.width, canvas.height);
		} else {
			context.fillStyle = '#000000';
			context.fillRect(0, 0, canvas.width, canvas.height);
		}
		window.requestAnimationFrame(update);
	}

	window.requestAnimationFrame(update);
</script>
