[versions]
minecraft = "26.3"
java = "25"
fabric-loader = "0.20.1"
# Libraries built for one Minecraft version, like Fabric API, have to be updated together with it
fabric-api = "0.165.0+26.3"
modmenu = "21.0.0"
loom = "1.19.3"
mod-publish = "2.2.1"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
mod-publish-plugin = { module = "me.modmuss50.mod-publish-plugin:me.modmuss50.mod-publish-plugin.gradle.plugin", version.ref = "mod-publish" }
